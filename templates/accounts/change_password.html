{% extends 'accounts/base.html' %}

{% block title %}Parolni o‘zgartirish — Pageora{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 p-md-5">
                <h3 class="fw-bold mb-4">Parolni o‘zgartirish</h3>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}" 
                               name="{{ field.name }}" 
                               class="form-control form-control-lg"
                               {% if field.value %}value="{{ field.value }}"{% endif %}>
                        {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100">O‘zgartirish</button>
                </form>
                <a href="{% url 'profile' %}" class="btn btn-outline-light w-100 mt-3">Orqaga</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
